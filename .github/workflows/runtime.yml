name: node/typescript runtime

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  runtime-test:
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v4.2.2

      - name: set up node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: install dependencies
        run: npm ci

      - name: compile typescript
        run: npm run build

      - name: do a dry run check
        env:
          NODE_ENV: test
        run: |
          # tests if node can evaluate the compiled bundle syntax without crashing
          node dist/index.js
